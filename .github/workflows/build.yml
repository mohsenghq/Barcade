name: build

# Produces the native builds this repo's development machine cannot: the
# Android SDK, and the Windows/macOS/iOS toolchains, are not usable from the
# dev environment (geo-blocked Google hosts / no macOS / no Windows).
# GitHub-hosted runners are not geo-blocked, so the SDK and toolchains resolve
# there. See docs/research/00-environment.md.
#
# Build artifacts are uploaded directly to GitHub Releases (not via
# upload-artifact) to avoid hitting the Actions artifact-storage quota.
# Each build job packages its output and pushes with `gh release upload`,
# which stores assets on the Release itself — no intermediate storage needed.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # ── Platform builds (tag push only) ─────────────────────────────────
  # Only run on v* tag pushes. Each job ensures the release exists
  # before uploading its asset — no race, no intermediate storage.

  build-web:
    name: Build Web
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Fetch the chess AI model for web bundles.
      - run: dart run tool/fetch_net.dart || true
        shell: bash
      # Copy model to web public dir so the React app can load it at runtime
      - run: node tool/fetch_web_model.mjs || echo '::warning::Model not available — web build will proceed without embedded AI'
        shell: bash
      - run: flutter build web --release
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd build/web
          zip -qr ../../starcade-web.zip .
          cd ../..
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" \
              --title "Starcade ${{ github.ref_name }}" \
              --generate-notes --draft=false
          gh release upload "${{ github.ref_name }}" starcade-web.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android (APK + AAB)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: flutter pub get
      # Fetch the chess AI model so it is baked into every build.
      # Non-fatal: the model release may not exist yet; the app handles missing model gracefully.
      - run: dart run tool/fetch_net.dart || true
        shell: bash
      - run: echo '::warning::If model fetch failed, build will proceed without embedded AI model'
        if: always()
      # Per-ABI APKs — each slice is ~30-40 MB instead of one 120 MB fat APK.
      - run: flutter build apk --split-per-abi --release --obfuscate --split-debug-info=build/debug-info
      - run: flutter build appbundle --release
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk starcade-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk starcade-android-arm.apk
          cp build/app/outputs/bundle/release/*.aab starcade-android.aab
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" \
              --title "Starcade ${{ github.ref_name }}" \
              --generate-notes --draft=false
          gh release upload "${{ github.ref_name }}" \
            starcade-android-arm64.apk \
            starcade-android-arm.apk \
            starcade-android.aab \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # audioplayers_linux (flame_audio) links GStreamer at build time — the
      # runner's base image does not ship the dev headers, so the Linux build
      # fails CMake configure without these.
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get
      - run: dart run tool/fetch_net.dart || true
        shell: bash
      - run: flutter build linux --release
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tar -czf starcade-linux.tar.gz -C build/linux/x64/release/bundle .
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" \
              --title "Starcade ${{ github.ref_name }}" \
              --generate-notes --draft=false
          gh release upload "${{ github.ref_name }}" starcade-linux.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/fetch_net.dart || true
        shell: bash
      - run: flutter build windows --release
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath starcade-windows.zip
          $tag = "${{ github.ref_name }}"
          $title = "Starcade $tag"
          gh release view $tag 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title $title --generate-notes --draft=false }
          gh release upload $tag starcade-windows.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/fetch_net.dart || true
        shell: bash
      - run: flutter build macos --release
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tar -czf starcade-macos.tar.gz -C build/macos/Build/Products/Release .
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" \
              --title "Starcade ${{ github.ref_name }}" \
              --generate-notes --draft=false
          gh release upload "${{ github.ref_name }}" starcade-macos.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS (unsigned simulator artifact)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Fetch the chess AI model so it is baked into the iOS build.
      - run: dart run tool/fetch_net.dart || true
        shell: bash
      # --no-codesign produces an unsigned .app runnable in the simulator,
      # proving the iOS build compiles without needing a signing identity.
      - run: flutter build ios --no-codesign --release
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tar -czf starcade-ios-simulator.tar.gz -C build/ios/iphoneos .
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" \
              --title "Starcade ${{ github.ref_name }}" \
              --generate-notes --draft=false
          gh release upload "${{ github.ref_name }}" starcade-ios-simulator.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
